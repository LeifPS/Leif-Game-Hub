<style>#boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--bg);color:var(--mut);z-index:99}#boot p{margin:0;font-size:14px}.bootmark{width:96px;height:96px;filter:drop-shadow(0 8px 20px rgba(80,70,220,.28))}.bm-h{stroke-dasharray:1;stroke-dashoffset:1;animation:bmdraw 1.1s .15s cubic-bezier(.5,.1,.3,1) forwards}.bm-dot{transform-box:fill-box;transform-origin:center;opacity:0;animation:bmdot .35s 1.15s ease-out forwards}@keyframes bmdraw{to{stroke-dashoffset:0}}@keyframes bmdot{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.bm-h{animation:none;stroke-dashoffset:0}.bm-dot{animation:none;opacity:1}}</style>
