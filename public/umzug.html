<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Umzug – Leif Game Hub</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #18130e; color: #f3eee9; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  p { max-width: 320px; margin: 0 auto; }
  small { color: #aa9a89; }
</style>
</head>
<body>
<p id="t">Deine Spielstände werden übertragen …<br><small>Dieses Fenster schließt sich gleich von selbst.</small></p>
<script>
/* Einmaliger Umzug von lgh.leifps.workers.dev nach leifps.de.
   Der Browser-Speicher gehört immer zu genau einer Adresse. Deshalb öffnet leifps.de dieses Fenster auf der alten Adresse,
   das liest die lokalen Spielstände und die Geräte-Kennung und schickt sie direkt an das öffnende Fenster zurück.
   Gesendet wird nur an https://leifps.de und https://hub.leifps.de (fest eingetragen), nie an eine andere Seite; angenommen wird es nur vom Fenster, das dieses geöffnet hat. Die Anmeldung (lgh.konto) wird NICHT übertragen. */
(function () {
  var ZIELE = ['https://leifps.de', 'https://hub.leifps.de'];
  var t = document.getElementById('t');
  if (!window.opener) { t.textContent = 'Dieses Fenster wird vom Hub aus geöffnet. Du kannst es schließen.'; return; }
  var daten = { stand: {}, geraet: null };
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && /^lgh\.stand\.[a-z0-9_-]{1,40}(\.vorher|\.sicher)?$/.test(k)) {
        var v = localStorage.getItem(k);
        if (typeof v === 'string' && v.length < 2000000) daten.stand[k] = v;
      }
    }
    var g = localStorage.getItem('lgh.geraet');
    if (g && /^[0-9a-f]{32}$/.test(g)) daten.geraet = g;
  } catch (e) { }
  try {
    ZIELE.forEach(function (z) { window.opener.postMessage({ lghUmzug: 1, daten: daten }, z); });
    t.innerHTML = 'Fertig. Dieses Fenster schließt sich …';
  } catch (e) { t.textContent = 'Das hat nicht geklappt. Du kannst das Fenster schließen.'; return; }
  setTimeout(function () { try { window.close(); } catch (e) { } }, 400);
})();
</script>
</body>
</html>
