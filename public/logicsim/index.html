<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogikLab – Logiksimulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 26 26%22%3E%3Crect x=%221%22 y=%221%22 width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230b5d63%22/%3E%3Cpath d=%22M6 9h4M6 17h4M10 6h4a7 7 0 010 14h-4zM21 13h2%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<meta name="description" content="LogikLab – kostenloser Logiksimulator für den Unterricht: Gatter nach DIN und ANSI, Flipflops, Wahrheitstabellen und Term-zu-Schaltung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: sachlich, präzise – ein Werkzeug für den Unterricht, kein Spielzeug
   IDEA: ein Schaltplan auf Rasterpapier, wie im Elektronik-Lehrbuch
   PICTURE: die Arbeitsfläche selbst, mit fertiger Beispielschaltung beim Öffnen
   COLOUR and TYPE: Weiß + Tinte, Petrol als Werkzeugfarbe, Grün = Signal 1; IBM Plex Sans/Mono
   LAYOUT: Werkzeugleiste oben, Bauteile links, Fläche Mitte, Eigenschaften rechts; mobil gestapelt */
:root{color-scheme:light;
--bg:#ffffff;--panel:#ffffff;--ink:#15181d;--muted:#5d6670;--rule:#e3e6e8;--soft:#f2f4f5;--acc:#0b5d63;--accink:#ffffff;--danger:#b4232c;
--cvbg:#fafbfa;--grid:#d3d8dc;--line:#2a3138;--body:#ffffff;--hi:#17a052;--lo:#8a949e;--txt:#15181d;--sel:#0b7d85;--pin:#2a3138}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
--bg:#0e1315;--panel:#131a1d;--ink:#e6eaec;--muted:#93a0a8;--rule:#253036;--soft:#1a2327;--acc:#3fb6bd;--accink:#04181a;--danger:#ff6b6b;
--cvbg:#101619;--grid:#29343a;--line:#c5ced3;--body:#172024;--hi:#38d47e;--lo:#5d6b75;--txt:#e6eaec;--sel:#3fb6bd;--pin:#c5ced3}}
:root[data-theme=dark]{color-scheme:dark;
--bg:#0e1315;--panel:#131a1d;--ink:#e6eaec;--muted:#93a0a8;--rule:#253036;--soft:#1a2327;--acc:#3fb6bd;--accink:#04181a;--danger:#ff6b6b;
--cvbg:#101619;--grid:#29343a;--line:#c5ced3;--body:#172024;--hi:#38d47e;--lo:#5d6b75;--txt:#e6eaec;--sel:#3fb6bd;--pin:#c5ced3}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden;
display:grid;height:100dvh;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:208px minmax(0,1fr) 268px;
grid-template-areas:"top top top" "pal main props" "stat stat stat"}
button,select,input,textarea{font:inherit;color:inherit}
header{grid-area:top;display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;white-space:nowrap;padding-right:6px}
.brand svg{flex:none}
.tools{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex:1;align-items:center;padding-bottom:1px}
.tools .sep{flex:none;width:1px;height:26px;background:var(--rule);margin:0 4px}
.tb{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;white-space:nowrap;font-size:14px}
.tb:hover{background:var(--soft)}
.tb:focus-visible,.pal:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tb svg{width:19px;height:19px;flex:none}
.tb.on{background:var(--acc);color:var(--accink)}
.tb:disabled{opacity:.35;cursor:default;background:none}
.tb .lb{display:none}
@media(min-width:1680px){.tb .lb{display:inline}}
.tb.always .lb{display:inline}
#palette{grid-area:pal;border-right:1px solid var(--rule);background:var(--panel);overflow-y:auto;padding:10px 10px 20px}
#palette h4{margin:14px 4px 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
#palette h4:first-child{margin-top:2px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;border:1px solid var(--rule);border-radius:9px;background:var(--bg);cursor:grab;touch-action:none;user-select:none;font-size:12.5px;line-height:1.2;text-align:center}
.pal:hover{border-color:var(--acc)}
.pal canvas{width:64px;height:40px;pointer-events:none}
main{grid-area:main;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#props{grid-area:props;border-left:1px solid var(--rule);background:var(--panel);overflow-y:auto;padding:14px 16px 24px}
#props h3{margin:0 0 10px;font-size:17px;font-weight:600}
#props .x{display:none}
.info{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.fld{display:block;margin:0 0 12px}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;font-size:16px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg)}
.fld textarea{resize:vertical;min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:500}
.btn.danger{color:var(--danger)}
.muted{color:var(--muted);font-size:13.5px}
.keys{font-size:13px;color:var(--muted);margin:16px 0 0;padding:0;list-style:none}
.keys li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--rule)}
kbd{font:12px "IBM Plex Mono",monospace;background:var(--soft);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;white-space:nowrap}
footer{grid-area:stat;display:flex;align-items:center;gap:14px;padding:4px 12px;border-top:1px solid var(--rule);background:var(--panel);font-size:13px;color:var(--muted);min-height:34px}
footer .grow{flex:1}
.warn{display:none;background:#b4232c;color:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500}
.warn.show{display:inline-block}
.zb{width:30px;height:28px;border:1px solid var(--rule);background:var(--bg);border-radius:6px;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(10,14,16,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.open{display:flex}
.mbox{background:var(--panel);color:var(--ink);border-radius:14px;width:min(760px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule)}
.mhead h2{margin:0;font-size:19px;font-weight:600}
.mbody{padding:16px 18px 20px;overflow:auto}
.mbody p{margin:0 0 12px}
.ttwrap{max-height:46vh;overflow:auto;border:1px solid var(--rule);border-radius:8px;margin:10px 0 16px}
table.tt{border-collapse:collapse;font:14px "IBM Plex Mono",monospace;width:100%}
.tt th,.tt td{padding:5px 12px;text-align:center;border-bottom:1px solid var(--rule)}
.tt th{position:sticky;top:0;background:var(--soft);font-family:"IBM Plex Sans",sans-serif;font-weight:600}
.tt .s{border-left:2px solid var(--line)}
.tt td.one{color:var(--hi);font-weight:600}
.expr{font:15px/1.6 "IBM Plex Mono",monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:0 0 8px;overflow-wrap:anywhere}
.ov{text-decoration:overline}
.note{background:var(--soft);border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px;font-size:14px;margin:0 0 12px}
.err{color:var(--danger);min-height:1.4em;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chips button{min-width:44px;height:40px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);cursor:pointer;font:16px "IBM Plex Mono",monospace}
#exin{width:100%;font:16px/1.5 "IBM Plex Mono",monospace;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);resize:vertical}
.exl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.exc{text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);cursor:pointer}
.exc:hover{border-color:var(--acc)}
.exc b{display:block;font-weight:600;margin-bottom:2px}
.exc span{font-size:13.5px;color:var(--muted)}
.hl{margin:0;padding-left:18px}.hl li{margin:0 0 6px}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
#ghost{position:fixed;pointer-events:none;z-index:40;background:var(--acc);color:var(--accink);padding:4px 10px;border-radius:6px;font-size:13px;display:none;transform:translate(-50%,-130%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){
body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "main" "pal" "stat"}
.brand span{display:none}
#palette{border-right:0;border-top:1px solid var(--rule);display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:8px 10px}
#palette h4{display:none}
.pgrid{display:flex;gap:6px;flex:none}
.pal{flex:none;width:76px}
#props{position:fixed;left:0;right:0;bottom:0;max-height:52dvh;border-left:0;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .2s;z-index:30}
body.has-sel #props{transform:none}
#props .x{display:block;position:absolute;right:10px;top:8px;width:40px;height:40px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.keys{display:none}
footer .hide-s{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--acc)"/><path d="M6 9h4M6 17h4M10 6h4a7 7 0 010 14h-4z" stroke="var(--accink)" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M21 13h2" stroke="var(--accink)" stroke-width="2"/></svg>
    <span>LogikLab</span>
  </div>
  <nav class="tools" id="tools" aria-label="Werkzeuge"></nav>
</header>
<aside id="palette" aria-label="Bauteile"></aside>
<main><canvas id="cv" aria-label="Arbeitsfläche der Schaltung"></canvas></main>
<section id="props" aria-label="Eigenschaften"></section>
<footer>
  <span id="st-info"></span>
  <span class="warn" id="st-warn">Schwingung erkannt – Schaltung ist instabil</span>
  <span class="grow"></span>
  <span class="hide-s" id="st-norm"></span>
  <button class="zb" data-act="zout" aria-label="Verkleinern">−</button>
  <span id="zoomv">100 %</span>
  <button class="zb" data-act="zin" aria-label="Vergrößern">+</button>
</footer>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="mbox"><div class="mhead"><h2 id="mtitle"></h2><button class="tb" data-act="close" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="mbody" id="mbody"></div></div></div>
<div id="toast"></div>
<div id="ghost"></div>
<input type="file" id="file" accept=".json,application/json" class="sr">
<script>
{
const G=20,$=s=>document.querySelector(s),FONT='"IBM Plex Sans",system-ui,sans-serif';
const cv=$('#cv'),ctx=cv.getContext('2d');
let X=ctx;
let comps=[],wires=[],nid=1,cam={x:60,y:40,z:1},sel=new Set(),norm='din',running=true,osc=false,need=true,touch=false;
let idx=new Map(),srcOf=new Map(),fan=new Map(),C={},act=null,hover=null,space=false,tt=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const snap=v=>Math.round(v/G)*G;
const byLabel=(a,b)=>(a.l||'').localeCompare(b.l||'','de',{numeric:true})||a.y-b.y;

/* ---------- Bauteile ---------- */
const GATES={
AND:{n:'UND',s:'&',f:a=>a.every(x=>x),info:'Ausgang ist 1, wenn alle Eingänge 1 sind.'},
OR:{n:'ODER',s:'≥1',f:a=>a.some(x=>x),info:'Ausgang ist 1, wenn mindestens ein Eingang 1 ist.'},
NOT:{n:'NICHT',s:'1',i:1,one:1,f:a=>a[0],info:'Kehrt das Signal um (Negation).'},
NAND:{n:'NAND',s:'&',i:1,f:a=>a.every(x=>x),info:'Negiertes UND: 0 nur, wenn alle Eingänge 1 sind.'},
NOR:{n:'NOR',s:'≥1',i:1,f:a=>a.some(x=>x),info:'Negiertes ODER: 1 nur, wenn alle Eingänge 0 sind.'},
XOR:{n:'XOR',s:'=1',f:a=>a.filter(x=>x).length%2===1,info:'Exklusiv-ODER: 1 bei einer ungeraden Anzahl von Einsen.'},
XNOR:{n:'XNOR',s:'=1',i:1,f:a=>a.filter(x=>x).length%2===1,info:'Äquivalenz: 1 bei einer geraden Anzahl von Einsen.'},
BUF:{n:'Puffer',s:'1',one:1,f:a=>a[0],info:'Gibt das Signal unverändert weiter.'}};
const nIn=c=>GATES[c.t].one?1:(c.n||2);
const gH=n=>n===1?2:(n%2?n+1:n+2);
const gIns=n=>{if(n===1)return[1];const r=[];if(n%2){for(let i=1;i<=n;i++)r.push(i)}else{for(let i=1;i<=n/2;i++)r.push(i);for(let i=n/2+2;i<=n+1;i++)r.push(i)}return r};
const LEDC={rot:'#ef4444',grün:'#22c55e',gelb:'#eab308',blau:'#3b82f6',weiß:'#e5e7eb'};
const HEXS=[0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F,0x77,0x7C,0x39,0x5E,0x79,0x71];
const T={};
for(const k in GATES){const g=GATES[k];T[k]={cat:'Gatter',name:g.n,info:g.info,
 size:c=>[5,gH(nIn(c))],ins:c=>gIns(nIn(c)).map(y=>[0,y]),outs:c=>[[5,gH(nIn(c))/2]],
 ev:(c,a)=>[(g.f(a)?1:0)^(g.i||0)],draw:drawGate,
 text:c=>norm==='din'?[{x:2.5*G,y:Math.min(gH(nIn(c))*G/2,20),s:(k[0]==='X'&&nIn(c)>2)?'2k+1':g.s,f:600,sz:k[0]==='X'&&nIn(c)>2?12:14}]:[]}}
const io=(name,draw,info,lab)=>({cat:'Eingänge',name,info,lab:'L',size:()=>[3,2],ins:()=>[],outs:()=>[[3,1]],ev:c=>[c.v?1:0],draw});
T.SW=io('Schalter',drawSW,'Rastet ein: Antippen schaltet zwischen 0 und 1.');
T.BTN=io('Taster',drawBTN,'Liefert 1, solange er gedrückt gehalten wird.');
T.CLK=io('Takt',drawCLK,'Erzeugt ein Rechtecksignal. Start/Stopp und Einzeltakt oben in der Werkzeugleiste.');
T.CONST={cat:'Eingänge',name:'Konstante',info:'Liefert dauerhaft 0 oder 1.',lab:'L',size:()=>[2,2],ins:()=>[],outs:()=>[[2,1]],ev:c=>[c.v?1:0],draw:drawCONST,text:c=>[{x:15,y:20,s:c.v?'1':'0',f:600,sz:15}]};
T.LED={cat:'Ausgänge',name:'Lampe',info:'Leuchtet, wenn am Eingang 1 anliegt.',lab:'R',size:()=>[2,2],ins:()=>[[0,1]],outs:()=>[],ev:(c,a)=>{c.v=a[0];return[]},draw:drawLED};
T.HEX={cat:'Ausgänge',name:'Hex-Anzeige',info:'Zeigt den 4-Bit-Wert (Gewichte 1, 2, 4, 8 von oben) als Hex-Ziffer 0–F.',lab:'R',size:()=>[4,6],ins:()=>[[0,1,'1'],[0,2,'2'],[0,3,'4'],[0,4,'8']],outs:()=>[],ev:(c,a)=>{c.v=a[0]+2*a[1]+4*a[2]+8*a[3];return[]},draw:drawHEX,
 text:()=>['1','2','4','8'].map((s,i)=>({x:17,y:(i+1)*G,s,sz:10,c:'#9aa5ad'}))};
const q2=c=>[c.q?1:0,c.q?0:1];
const edge=(c,clk)=>{const e=clk&&c.pc===0;c.pc=clk;return e};
const FF=(name,info,ins,step)=>({cat:'Speicher',name,info,size:()=>[4,4],ins:()=>ins,outs:()=>[[4,1,'Q'],[4,3,'Q̅']],ev:step,draw:drawFF,
 text:c=>[...ins.filter(p=>p[2]!=='>').map(p=>({x:20,y:p[1]*G,s:p[2],sz:12,f:600})),{x:60,y:G,s:'Q',sz:12,f:600},{x:60,y:3*G,s:'Q̅',sz:12,f:600}]});
T.RS=FF('RS-Flipflop','S setzt Q auf 1, R setzt zurück. S = R = 1 ist verboten (beide Ausgänge 0).',[[0,1,'S'],[0,3,'R']],(c,a)=>{if(a[0]&&a[1]){c.q=0;return[0,0]}if(a[0])c.q=1;else if(a[1])c.q=0;return q2(c)});
T.DFF=FF('D-Flipflop','Übernimmt D bei steigender Taktflanke.',[[0,1,'D'],[0,3,'>']],(c,a)=>{if(edge(c,a[1]))c.q=a[0];return q2(c)});
T.JK=FF('JK-Flipflop','Steigende Flanke: J setzt, K setzt zurück, J = K = 1 kippt.',[[0,1,'J'],[0,2,'>'],[0,3,'K']],(c,a)=>{if(edge(c,a[1])){if(a[0]&&a[2])c.q=c.q?0:1;else if(a[0])c.q=1;else if(a[2])c.q=0}return q2(c)});
T.TFF=FF('T-Flipflop','Kippt bei steigender Taktflanke, wenn T = 1.',[[0,1,'T'],[0,3,'>']],(c,a)=>{if(edge(c,a[1])&&a[0])c.q=c.q?0:1;return q2(c)});
T.TEXT={cat:'Sonstiges',name:'Text',info:'Freie Beschriftung für Erklärungen und Arbeitsblätter.',size:c=>textSize(c),ins:()=>[],outs:()=>[],ev:()=>[],draw:()=>{},
 text:c=>(c.txt||'Text').split('\n').map((s,i)=>({x:4,y:(c.sz||16)*(0.75+i*1.35),s,sz:c.sz||16,a:'left',f:500}))};
function textSize(c){const sz=c.sz||16,ls=(c.txt||'Text').split('\n');ctx.font=`500 ${sz}px ${FONT}`;const w=Math.max(...ls.map(l=>ctx.measureText(l).width));return[Math.max(2,Math.ceil((w+10)/G)),Math.max(1,Math.ceil((ls.length*sz*1.35)/G))]}
const ORDER=[['Eingänge',['SW','BTN','CLK','CONST']],['Ausgänge',['LED','HEX']],['Gatter',['AND','OR','NOT','NAND','NOR','XOR','XNOR','BUF']],['Speicher',['RS','DFF','JK','TFF']],['Sonstiges',['TEXT']]];

/* ---------- Geometrie ---------- */
function sizeR(c){const[w,h]=T[c.t].size(c);return(c.r||0)%2?[h,w]:[w,h]}
function bb(c){const[w,h]=sizeR(c);return{x:c.x*G,y:c.y*G,w:w*G,h:h*G}}
function lp(c,lx,ly){const[w,h]=T[c.t].size(c),W=w*G,H=h*G,r=c.r||0;let x=lx,y=ly;if(r===1){x=H-ly;y=lx}else if(r===2){x=W-lx;y=H-ly}else if(r===3){x=ly;y=W-lx}return{x:c.x*G+x,y:c.y*G+y}}
function pinW(c,k,p){const t=T[c.t],[w,h]=t.size(c),pl=(k==='o'?t.outs(c):t.ins(c))[p];if(!pl)return null;const[x,y]=pl;const dx=x===0?-1:x===w?1:0,dy=dx?0:(y===0?-1:1);const r=c.r||0;let X1,Y1,DX,DY;
 if(r===0){X1=x;Y1=y;DX=dx;DY=dy}else if(r===1){X1=h-y;Y1=x;DX=-dy;DY=dx}else if(r===2){X1=w-x;Y1=h-y;DX=-dx;DY=-dy}else{X1=y;Y1=w-x;DX=dy;DY=-dx}
 return{x:(c.x+X1)*G,y:(c.y+Y1)*G,dx:DX,dy:DY}}

function qm(n,ones){if(!ones.length)return'0';if(ones.length===1<<n)return'1';

  groups.forEach((g,i)=>{if(!used.has(i)&&!primes.some(p=>p.v===g.v&&p.d===g.d))primes.push(g)});groups=next}

 while(changed){changed=false;for(const m of rem){const cov=primes.filter(p=>p.ms.includes(m));if(cov.length===1&&!chosen.includes(cov[0])){chosen.push(cov[0]);cov[0].ms.forEach(x=>rem.delete(x));changed=true}}}
 const bits=x=>{let c=0;while(x){c+=x&1;x>>=1}return c};
 while(rem.size){let best=null,bs=-1;for(const p of primes){const s=p.ms.filter(m=>rem.has(m)).length*100+bits(p.d);if(s>bs){bs=s;best=p}}chosen.push(best);best.ms.forEach(x=>rem.delete(x))}

 if(mode==='prog'){const s=terms.map(ls=>{const t=ls.map(l=>(l.neg?'!':'')+l.nm).join(' && ');return terms.length>1&&ls.length>1?'('+t+')':t}).join(' || ');return{html:esc(s),plain:s}}

const safeName=(s,i,p)=>(String(s||'').replace(/[^\wÄÖÜäöüß]/g,'')||(p+(i+1))).replace(/^\d/,'_$&');
function truthTable(){rebuild();const ins=comps.filter(c=>c.t==='SW'||c.t==='BTN').sort(byLabel),outs=comps.filter(c=>c.t==='LED').sort(byLabel);
 if(!ins.length||!outs.length){modal('Wahrheitstabelle','<p>Für die Wahrheitstabelle braucht die Schaltung mindestens einen Schalter (Eingang) und eine Lampe (Ausgang). Spalten werden nach den Beschriftungen sortiert.</p>');return}
 if(ins.length>10){modal('Wahrheitstabelle',`<p>Die Schaltung hat ${ins.length} Eingänge. Die Wahrheitstabelle ist auf 10 Eingänge (1024 Zeilen) begrenzt.</p>`);return}
 const snapS=comps.map(c=>[c,c.v,c.q,c.pc,c.o.slice()]),n=ins.length,rows=[];let unstable=false;
 for(let m=0;m<1<<n;m++){ins.forEach((c,i)=>c.v=(m>>(n-1-i))&1);settle(ins);if(osc)unstable=true;rows.push(outs.map(o=>o.v|0))}
 for(const[c,v,q,pc,o]of snapS){c.v=v;c.q=q;c.pc=pc;c.o=o}settle(comps);
 tt={ins:ins.map((c,i)=>safeName(c.l,i,'E')),outs:outs.map((c,i)=>safeName(c.l,i,'Y')),rows,mem:comps.some(c=>T[c.t].cat==='Speicher'),unstable,mode:store.get('logiklab.nota')||'logic'};
 tt.res=tt.outs.map((_,j)=>qm(n,rows.map((r,i)=>r[j]?i:-1).filter(i=>i>=0)));renderTT()}
function renderTT(){const n=tt.ins.length;let h='';
 if(tt.mem)h+='<p class="note">Die Schaltung enthält Speicherglieder. Die Tabelle zeigt die Ausgänge ausgehend vom aktuellen Speicherzustand.</p>';
 if(tt.unstable)h+='<p class="note">Bei mindestens einer Eingangskombination schwingt die Schaltung – diese Zeilen sind nicht eindeutig.</p>';
 h+=`<div class="row" style="align-items:center;margin:0"><label class="muted" for="nota">Schreibweise</label><select id="nota" class="btn">${opt('logic',tt.mode,'Logik: ¬ ∧ ∨')}${opt('tech',tt.mode,'Technik: A̅ · +')}${opt('prog',tt.mode,'Programmierung: ! && ||')}</select></div>`;
 h+=`<div class="ttwrap"><table class="tt"><thead><tr><th>#</th>${tt.ins.map(s=>`<th>${esc(s)}</th>`).join('')}${tt.outs.map((s,j)=>`<th${j?'':' class="s"'}>${esc(s)}</th>`).join('')}</tr></thead><tbody>`;
 tt.rows.forEach((r,i)=>{h+=`<tr><td class="muted">${i}</td>${tt.ins.map((_,k)=>{const b=(i>>(n-1-k))&1;return`<td>${b}</td>`}).join('')}${r.map((v,j)=>`<td class="${j?'':'s '}${v?'one':''}">${v}</td>`).join('')}</tr>`});
 h+='</tbody></table></div><h3 style="margin:0 0 8px;font-size:16px">Minimierte Terme (disjunktive Normalform)</h3>';
 tt.outs.forEach((o,j)=>{h+=`<div class="expr"><b>${esc(o)}</b> = ${fmt(tt.res[j],tt.ins,tt.mode).html}</div>`});
 h+=`<div class="row" style="margin-top:12px"><button class="btn" data-act="ttcsv">Tabelle kopieren (CSV)</button><button class="btn" data-act="ttcopy">Terme kopieren</button><button class="btn primary" data-act="ttbuild">Minimierte Schaltung aufbauen</button></div>`;
 modal('Wahrheitstabelle',h);$('#nota').addEventListener('change',e=>{tt.mode=e.target.value;store.set('logiklab.nota',tt.mode);renderTT()})}

/* ---------- Term → Schaltung ---------- */
function parse(src){const toks=[];let i=0;const OPW={and:'and',und:'and',or:'or',oder:'or',not:'not',nicht:'not',xor:'xor'};
 while(i<src.length){const ch=src[i];if(/\s/.test(ch)){i++;continue}
  const m=/^[A-Za-zÄÖÜäöüß_][\wÄÖÜäöüß]*/.exec(src.slice(i));if(m){const w=m[0],l=w.toLowerCase();toks.push(OPW[l]?{t:OPW[l]}:{t:'var',v:w});i+=w.length;continue}
  if(ch==='0'||ch==='1'){toks.push({t:'c',v:+ch});i++;continue}
  if(src.startsWith('&&',i)||src.startsWith('||',i)){toks.push({t:ch==='&'?'and':'or'});i+=2;continue}
  const map={'¬':'not','!':'not','~':'not',"'":'post','∧':'and','&':'and','*':'and','·':'and','⋅':'and','.':'and','∨':'or','|':'or','+':'or','⊕':'xor','^':'xor','(':'(',')':')'};
  if(map[ch]){toks.push({t:map[ch]});i++;continue}throw new Error(`Unbekanntes Zeichen „${ch}“`)}
 let p=0;const peek=()=>toks[p]&&toks[p].t,eat=t=>{if(peek()!==t)throw new Error(t===')'?'Schließende Klammer fehlt':'Unerwartetes Ende');p++};
 const nary=(k,a)=>{const f=[];for(const x of a)x.k===k?f.push(...x.a):f.push(x);return f.length===1?f[0]:chunk(k,f)};
 const chunk=(k,a)=>a.length<=8?{k,a}:{k,a:Array.from({length:Math.ceil(a.length/8)},(_,j)=>a.slice(j*8,j*8+8)).map(g=>g.length===1?g[0]:{k,a:g})};
 function por(){const a=[pxor()];while(peek()==='or'){p++;a.push(pxor())}return nary('or',a)}
 function pxor(){const a=[pand()];while(peek()==='xor'){p++;a.push(pand())}return nary('xor',a)}
 function pand(){const a=[pun()];while(peek()==='and'||['var','c','not','('].includes(peek())){if(peek()==='and')p++;a.push(pun())}return nary('and',a)}
 function pun(){if(peek()==='not'){p++;return{k:'not',a:[pun()]}}let n=prim();while(peek()==='post'){p++;n={k:'not',a:[n]}}return n}
 function prim(){const t=toks[p];if(!t)throw new Error('Ausdruck unvollständig');if(t.t==='var'){p++;return{k:'var',n:t.v}}if(t.t==='c'){p++;return{k:'c',v:t.v}}if(t.t==='('){p++;const n=por();eat(')');return n}throw new Error('Operand erwartet')}
 if(!toks.length)throw new Error('Leerer Ausdruck');const r=por();if(p<toks.length)throw new Error('Unerwartetes Zeichen nach dem Ausdruck');return r}
function parseLines(txt){const out=[];txt.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean).forEach((line,i)=>{const m=/^([A-Za-zÄÖÜäöüß_][\wÄÖÜäöüß]*)\s*=(?!=)(.*)$/.exec(line);
 let name=m?m[1]:(i?'Y'+(i+1):'Y'),ex=m?m[2]:line;try{out.push({name,ast:parse(ex)})}catch(e){throw new Error(`Zeile ${i+1}: ${e.message}`)}});if(!out.length)throw new Error('Bitte einen Term eingeben');return out}
function buildFrom(list,append){let ox=2,oy=2;
 if(append&&comps.length){const b=bounds();oy=Math.ceil(b.y2/G)+3;ox=Math.max(2,Math.floor(b.x1/G)+3)}else{comps=[];wires=[];nid=1}
 const vars=[],walk=n=>{if(n.k==='var'&&!vars.includes(n.n))vars.push(n.n);if(n.k==='c'&&!vars.includes('#'+n.v))vars.push('#'+n.v);(n.a||[]).forEach(walk)};list.forEach(e=>walk(e.ast));
 vars.sort((a,b)=>a.localeCompare(b,'de',{numeric:true}));const add=(t,x,y,pr)=>{const id=nid++;comps.push({id,t,x,y,r:0,...pr});return id};
 const src={};vars.forEach((v,i)=>{const y=oy+i*3;const id=v[0]==='#'?add('CONST',ox+1,y,{v:+v[1],l:''}):add('SW',ox,y,{l:v,v:0});src[v]={id,y:y+1,trunk:ox+4+i}});
 const c1=ox+3+vars.length+3,colX=d=>c1+(d-1)*9,depth=n=>n.k==='var'||n.k==='c'?0:1+Math.max(...n.a.map(depth)),free={},memo=new Map();
 function place(n){if(n.k==='var'||n.k==='c'){const s=src[n.k==='var'?n.n:'#'+n.v];return{id:s.id,y:s.y,trunk:s.trunk}}
  const key=JSON.stringify(n);if(memo.has(key))return memo.get(key);const ch=n.a.map(place),d=depth(n),t={not:'NOT',and:'AND',or:'OR',xor:'XOR'}[n.k],k=t==='NOT'?1:ch.length,h=gH(k);
  let gy=Math.round(ch.reduce((s,c)=>s+c.y,0)/ch.length-h/2);gy=Math.max(gy,free[d]!=null?free[d]:oy);free[d]=gy+h+1;const x=colX(d),id=add(t,x,gy,{n:k,l:''});
  ch.forEach((c,i)=>wires.push({id:nid++,a:[c.id,0],b:[id,i],mx:c.trunk!=null?c.trunk:x-1-(i%3)}));const res={id,y:gy+h/2};memo.set(key,res);return res}
 const maxD=Math.max(0,...list.map(e=>depth(e.ast))),lx=(maxD?colX(maxD)+5:c1)+5;let lf=oy;
 list.forEach(e=>{const s=place(e.ast);const ly=Math.max(Math.round(s.y-1),lf);lf=ly+3;const id=add('LED',lx,ly,{l:e.name});wires.push({id:nid++,a:[s.id,0],b:[id,0],mx:s.trunk!=null?s.trunk:undefined})});
 sel.clear();rebuild();settle(comps);renderProps();fit();commit()}
function exprDialog(pre){modal('Term → Schaltung',`<p>Gib einen oder mehrere Terme ein, jeweils in einer eigenen Zeile. LogikLab baut daraus automatisch die Schaltung mit Schaltern und Lampen.</p>
 <textarea id="exin" rows="4" spellcheck="false">${esc(pre||store.get('logiklab.expr')||'Y = (A ∧ ¬S) ∨ (B ∧ S)')}</textarea>
 <div class="chips">${['∧','∨','¬','⊕','(',')','='].map(s=>`<button data-ins="${s}" aria-label="${s} einfügen">${s}</button>`).join('')}</div>
 <p class="muted">Erlaubt: UND <code>∧ & · * and und</code>, ODER <code>∨ | + or oder</code>, NICHT <code>¬ ! ~ not nicht</code> oder nachgestellt <code>A'</code>, XOR <code>⊕ ^ xor</code>, Klammern, Konstanten 0 und 1. Ohne Zeichen zwischen zwei Variablen wird UND angenommen (<code>A B</code>).</p>
 <label class="muted" style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="exadd" style="width:20px;height:20px"> Zur aktuellen Schaltung hinzufügen statt ersetzen</label>
 <p class="err" id="exerr"></p><div class="row"><button class="btn primary" data-act="exbuild">Schaltung erzeugen</button></div>`);
 $('#mbody').querySelector('.chips').addEventListener('click',e=>{const b=e.target.closest('[data-ins]');if(!b)return;const ta=$('#exin'),s=ta.selectionStart,en=ta.selectionEnd,v=' '+b.dataset.ins+' ';ta.value=ta.value.slice(0,s)+v+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+v.length})}

function hand(fn){comps=[];wires=[];nid=1;const add=(t,x,y,p={})=>{const id=nid++;comps.push({id,t,x,y,r:0,l:'',...p});return id};const W=(a,pa,b,pb,o={})=>wires.push({id:nid++,a:[a,pa],b:[b,pb],...o});fn(add,W);sel.clear();rebuild();settle(comps);renderProps();fit();commit()}
const EX=[

  W(A,0,X1,0,{mx:6});W(A,0,U,0,{mx:6});W(B,0,X1,1,{mx:7});W(B,0,U,1,{mx:7});W(X1,0,S,0);W(U,0,Cc,0);a('TEXT',2,11,{txt:'S = A ⊕ B     C = A ∧ B',sz:16})})},
 {n:'Volladdierer',d:'Zwei Halbaddierer und ein ODER – Grundbaustein jedes Rechenwerks.',f:()=>hand((a,W)=>{const A=a('SW',2,1,{l:'A'}),B=a('SW',2,5,{l:'B'}),Ci=a('SW',2,9,{l:'Cin'}),X1=a('XOR',10,1),U1=a('AND',10,12),X2=a('XOR',18,3),U2=a('AND',18,8),O=a('OR',26,10),S=a('LED',26,4,{l:'S'}),Co=a('LED',34,11,{l:'Cout'});
  W(A,0,X1,0,{mx:6});W(A,0,U1,0,{mx:6});W(B,0,X1,1,{mx:7});W(B,0,U1,1,{mx:7});W(X1,0,X2,0);W(Ci,0,X2,1,{mx:8});W(X1,0,U2,0);W(Ci,0,U2,1,{mx:8});W(U2,0,O,0);W(U1,0,O,1);W(X2,0,S,0);W(O,0,Co,0);
  a('TEXT',2,18,{txt:'S = A ⊕ B ⊕ Cin\nCout = (A ∧ B) ∨ (Cin ∧ (A ⊕ B))',sz:16})})},
 {n:'RS-Flipflop aus NOR',d:'Zwei rückgekoppelte NOR-Gatter speichern ein Bit.',f:()=>hand((a,W)=>{const R=a('SW',2,1,{l:'R'}),S=a('SW',2,10,{l:'S'}),N1=a('NOR',9,1),N2=a('NOR',9,8),Q=a('LED',18,2,{l:'Q'}),Qn=a('LED',18,9,{l:'Q̅'});
  W(R,0,N1,0);W(S,0,N2,1);W(N1,0,N2,0,{my:6});W(N2,0,N1,1,{my:7,ex:7});W(N1,0,Q,0);W(N2,0,Qn,0);a('TEXT',2,14,{txt:'S = 1 setzt, R = 1 setzt zurück, beide 0 = speichern',sz:14})})},
 {n:'4-Bit-Zähler',d:'Asynchroner Binärzähler aus T-Flipflops mit Hex-Anzeige.',f:()=>hand((a,W)=>{const clk=a('CLK',2,4,{l:'Takt',hz:2});let prev=null;const ff=[];
  for(let i=0;i<4;i++){const y=2+7*i,k=a('CONST',6,y,{v:1}),f=a('TFF',10,y),L=a('LED',16,y,{l:'Q'+i});W(k,0,f,0);W(f,0,L,0);if(prev)W(prev,1,f,1,{my:y-2});else W(clk,0,f,1);prev=f;ff.push(f)}
  const H=a('HEX',24,2,{l:'Zählerstand'});ff.forEach((f,i)=>W(f,0,H,i,i?{mx:19+i}:{}));})},
 {n:'2:1-Multiplexer',d:'S wählt aus, ob A oder B zum Ausgang durchgeschaltet wird.',e:'Y = (A ∧ ¬S) ∨ (B ∧ S)'},
 {n:'Mehrheitsentscheider',d:'Ausgang 1, wenn mindestens zwei von drei Eingängen 1 sind.',e:'Y = (A ∧ B) ∨ (A ∧ C) ∨ (B ∧ C)'},
 {n:'De Morgan',d:'Zwei Schaltungen mit gleicher Wahrheitstabelle zum Vergleichen.',e:'Y1 = ¬(A ∧ B)\nY2 = ¬A ∨ ¬B'},
 {n:'Vergleicher (1 Bit)',d:'Prüft, ob zwei Bits gleich sind, und welches größer ist.',e:'Gleich = ¬(A ⊕ B)\nGroesser = A ∧ ¬B\nKleiner = ¬A ∧ B'}];
function exDialog(){modal('Beispiele',`<p>Öffnet eine fertige Schaltung. Die aktuelle Schaltung lässt sich mit „Rückgängig“ zurückholen.</p><div class="exl">${EX.map((x,i)=>`<button class="exc" data-act="exload" data-i="${i}"><b>${esc(x.n)}</b><span>${esc(x.d)}</span></button>`).join('')}</div>`)}
function helpDialog(){modal('Hilfe',`<ul class="hl">
<li><b>Bauteile einfügen:</b> aus der Leiste auf die Fläche ziehen oder antippen.</li>
<li><b>Verbinden:</b> von einem Anschlusspunkt (Ausgang) zu einem Eingang ziehen. Ein Eingang hat genau eine Leitung, ein Ausgang beliebig viele.</li>
<li><b>Schalter</b> durch Klicken umlegen, <b>Taster</b> gedrückt halten. Grüne Leitungen führen 1, graue 0.</li>
<li><b>Auswählen:</b> Rahmen aufziehen (Maus) oder mit Umschalt mehrere anklicken. Eigenschaften wie Beschriftung, Eingangszahl, Farbe und Frequenz stehen rechts.</li>
<li><b>Leitungsverlauf:</b> Leitung anklicken und das mittlere Teilstück verschieben.</li>
<li><b>Fläche bewegen:</b> Leertaste oder rechte Maustaste gedrückt halten und ziehen; auf Touch-Geräten mit einem Finger auf freier Fläche. Zoomen mit Mausrad oder zwei Fingern.</li>
<li><b>Wahrheitstabelle:</b> erstellt alle Kombinationen der Schalter und berechnet minimierte Terme (Quine-McCluskey).</li>
<li><b>Term → Schaltung:</b> baut aus einem booleschen Term automatisch die Gatterschaltung.</li>
<li><b>Takt:</b> Takt-Bauteile laufen mit eingestellter Frequenz; „Einzeltakt“ erzeugt genau einen Impuls.</li>
<li><b>Norm:</b> Schaltzeichen nach DIN EN 60617 (Kästen mit &, ≥1, =1) oder amerikanischer Norm ANSI.</li>
<li><b>Speichern:</b> als Datei oder Text; zusätzlich wird automatisch im Browser gesichert.</li></ul>
<p class="muted" style="margin-top:12px">Tastenkürzel: Entf löschen · R drehen · Strg Z/Y rückgängig/wiederholen · Strg C/V/D kopieren/einfügen/duplizieren · Strg A alles · W Wahrheitstabelle · F einpassen · Strg S speichern</p>`)}
function stepClock(){const cl=comps.filter(c=>c.t==='CLK');if(!cl.length){toast('Kein Takt-Bauteil in der Schaltung');return}if(running){running=false;updBtns()}
 cl.forEach(c=>c.v=0);settle(cl);cl.forEach(c=>c.v=1);settle(cl);setTimeout(()=>{cl.forEach(c=>c.v=0);settle(cl)},180)}

/* ---------- Aktionen ---------- */
const ACT={
 new:()=>{comps=[];wires=[];sel.clear();rebuild();settle([]);renderProps();fit();commit();toast('Neue Schaltung – „Rückgängig“ holt die alte zurück')},

 zin:()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.2),zout:()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1/1.2),

 ttcsv:()=>copyText([[...tt.ins,...tt.outs].join(';'),...tt.rows.map((r,i)=>[...tt.ins.map((_,k)=>(i>>(tt.ins.length-1-k))&1),...r].join(';'))].join('\n')),
 ttcopy:()=>copyText(tt.outs.map((o,j)=>o+' = '+fmt(tt.res[j],tt.ins,tt.mode).plain).join('\n')),
 ttbuild:()=>{const txt=tt.outs.map((o,j)=>o+' = '+fmt(tt.res[j],tt.ins,'logic').plain).join('\n');closeModal();exprDialog(txt);toast('Terme übernommen – prüfen und erzeugen')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b)});
