<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<meta name="color-scheme" content="dark">
<title>Leifs Spiele</title>
<meta name="description" content="Alle Spiele von Leif an einem Ort.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="home">

<!-- Symbole (alle selbst gezeichnet) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ba0ff"/><stop offset="1" stop-color="#6a4bff"/>
    </linearGradient>
  </defs>
  <symbol id="logo" viewBox="0 0 36 36">
    <rect width="36" height="36" rx="10" fill="url(#logo-grad)"/>
    <path d="M12.5 9.5v13.2c0 1.2 1 2.2 2.2 2.2H24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23.5" cy="12.5" r="2.4" fill="#fff"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8.2a.8.8 0 0 1-.8.8H15v-5.5H9V20H4.8a.8.8 0 0 1-.8-.8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.6v14.8a.9.9 0 0 0 1.4.8l12-7.4a.9.9 0 0 0 0-1.6l-12-7.4A.9.9 0 0 0 7 4.6z" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5M19.5 4.5v4.8h-4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19h11a1.5 1.5 0 0 0 1.5-1.5V14M14 5h5v5M19 5l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <aside class="side" aria-label="Bibliothek">
    <a class="brand" href="#" aria-label="Leifs Spiele, zur Startseite">
      <svg class="brand-mark" aria-hidden="true"><use href="#logo"/></svg>
      <span class="brand-name">Leifs Spiele</span>
    </a>
    <nav id="bibliothek" aria-label="Alle Spiele"></nav>
    <div class="side-fuss" id="side-fuss"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Leifs Spiele, zur Startseite">
        <svg class="brand-mark" aria-hidden="true"><use href="#logo"/></svg>
        <span class="brand-name">Leifs Spiele</span>
      </a>
      <label class="search">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input id="suche" type="search" placeholder="Spiele durchsuchen" autocomplete="off" spellcheck="false" aria-label="Spiele durchsuchen">
      </label>
    </header>
    <main id="inhalt"></main>
  </div>
</div>

<div class="spiel" id="spiel" role="dialog" aria-label="Spiel">
  <div class="leiste">
    <button class="ibtn" id="zurueck" type="button" aria-label="Zurück zur Spielseite">
      <svg aria-hidden="true"><use href="#i-back"/></svg><span class="text">Zurück</span>
    </button>
    <div class="titel" id="spieltitel"></div>
    <button class="ibtn" id="vollbild" type="button" aria-label="Vollbild" hidden>
      <svg aria-hidden="true"><use href="#i-full"/></svg><span class="text">Vollbild</span>
    </button>
    <button class="ibtn" id="neuladen" type="button" aria-label="Spiel neu laden">
      <svg aria-hidden="true"><use href="#i-reload"/></svg><span class="text">Neu laden</span>
    </button>
    <a class="ibtn" id="extern" target="_blank" rel="noopener" aria-label="In neuem Tab öffnen">
      <svg aria-hidden="true"><use href="#i-external"/></svg><span class="text">Neuer Tab</span>
    </a>
  </div>
  <div class="buehne" id="buehne">
    <iframe id="rahmen" title="Spiel"
      allow="fullscreen; autoplay; clipboard-write; gamepad; accelerometer; gyroscope"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock allow-modals allow-downloads allow-orientation-lock"></iframe>
    <div class="lade-hinweis" id="hinweis">Das Spiel lädt nicht? <a id="hinweis-link" target="_blank" rel="noopener">In neuem Tab öffnen</a></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
