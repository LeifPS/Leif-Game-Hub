<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nacht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08111a"/><stop offset="1" stop-color="#143247"/></linearGradient>
    <radialGradient id="lat" cx="190" cy="340" r="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffc766" stop-opacity=".8"/><stop offset=".4" stop-color="#ff9a3c" stop-opacity=".2"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="nebel" cx="540" cy="70" r="215" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e3eef0" stop-opacity=".95"/><stop offset=".55" stop-color="#d3e2e6" stop-opacity=".75"/><stop offset="1" stop-color="#d3e2e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="strahl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe3a0" stop-opacity="0"/><stop offset="1" stop-color="#ffe3a0" stop-opacity=".6"/></linearGradient>
    <filter id="weich" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
